[project]
name = "scilitrag"
version = "0.1.0"
description = "RAG literature assistant over the LitSearch dataset"
readme = "README.md"
requires-python = ">=3.13,<3.14"
dependencies = [
    "fastapi>=0.135",
    "uvicorn>=0.30",
    "pydantic>=2.7",
    "python-dotenv>=1.0",
]

[dependency-groups]
dev = [
    "httpx2>=2.0",
    "pytest>=8.0",
    "ruff>=0.6",
]
data = [
    "datasets>=3.0",
]
rag = ["httpx>=0.28,<1", "psycopg[binary]>=3.2,<4"]
guardrails = [
    "torch>=2.14.1",
]
ui = [
    "httpx2>=2.13",
    "streamlit>=1.66",
]
bench = []

# CPU-only torch on every platform (Prompt Guard and NLI run on CPU, small image).
# Add torch as a direct dependency in any group that needs it, so this source applies.
[tool.uv.sources]
torch = [{ index = "pytorch-cpu" }]

[[tool.uv.index]]
name = "pytorch-cpu"
url = "https://download.pytorch.org/whl/cpu"
explicit = true

[build-system]
requires = ["uv_build>=0.13.1,<0.14.0"]
build-backend = "uv_build"

[tool.ruff]
line-length = 100
target-version = "py313"

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["scripts"]