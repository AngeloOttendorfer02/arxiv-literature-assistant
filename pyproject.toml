[project]
name = "scilitrag"
version = "0.1.0"
description = "RAG literature assistant over the LitSearch dataset"
readme = "README.md"
requires-python = ">=3.13,<3.14"
dependencies = [
    "fastapi>=0.135",
    "uvicorn>=0.30",
    "pydantic>=2.7",
    "python-dotenv>=1.0",
]

[dependency-groups]
dev = [
    "httpx2>=2.0",
    "pytest>=8.0",
    "ruff>=0.6",
]
data = [
    "datasets>=3.0",
]
rag = []
guardrails = []
ui = []
bench = []

[build-system]
requires = ["uv_build>=0.10.6,<0.11.0"]
build-backend = "uv_build"

[tool.ruff]
line-length = 100
target-version = "py313"

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["scripts"]
