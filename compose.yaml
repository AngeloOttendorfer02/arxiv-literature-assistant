name: scilitrag

services:
  db:
    image: paradedb/paradedb:0.26.2-pg18
    environment:
      POSTGRES_USER: ${POSTGRES_USER:?set POSTGRES_USER in .env}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:?set POSTGRES_PASSWORD in .env}
      POSTGRES_DB: ${POSTGRES_DB:?set POSTGRES_DB in .env}
      # Used only when roles.sql is explicitly run by the administrator.
      APP_DB_USER: ${APP_DB_USER:?set APP_DB_USER in .env}
      APP_DB_PASSWORD: ${APP_DB_PASSWORD:?set APP_DB_PASSWORD in .env}
      INGEST_DB_USER: ${INGEST_DB_USER:?set INGEST_DB_USER in .env}
      INGEST_DB_PASSWORD: ${INGEST_DB_PASSWORD:?set INGEST_DB_PASSWORD in .env}
    # Parallel HNSW builds on the full corpus need about 1 GB; Docker's default is 64 MB.
    shm_size: 2gb
    ports:
      - "127.0.0.1:${DB_PORT:-5432}:5432"
    volumes:
      - pgdata:/var/lib/postgresql
      # Single file, so the image's own bootstrap script in the same folder still runs.
      - ./docker/db/20-extensions.sql:/docker-entrypoint-initdb.d/20-extensions.sql:ro
      # Explicit setup files; this directory is not processed by initdb.
      - ./docker/db:/opt/scilitrag/db:ro
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U $${POSTGRES_USER} -d $${POSTGRES_DB}"]
      interval: 5s
      timeout: 3s
      retries: 20
    restart: unless-stopped

  api:
    build:
      context: .
      dockerfile: docker/api/Dockerfile
    environment:
      USE_MOCKS: ${USE_MOCKS:-1}
      REAL_COMPONENTS: ${REAL_COMPONENTS:-}
      # Same app role as DATABASE_URL in .env, but reached via the compose service name.
      DATABASE_URL: postgresql://${APP_DB_USER:?set APP_DB_USER in .env}:${APP_DB_PASSWORD:?set APP_DB_PASSWORD in .env}@db:5432/${POSTGRES_DB}
      # Ollama on the host by default; set API_LLM_BASE_URL and API_LLM_API_KEY for Modal.
      LLM_BASE_URL: ${API_LLM_BASE_URL:-http://host.docker.internal:11434/v1}
      LLM_API_KEY: ${API_LLM_API_KEY:-}
      # NLI on Modal next to Ollama, authorized with the same token; empty runs NLI on the CPU.
      NLI_URL: ${API_NLI_URL:-}
      LLM_MODEL: ${LLM_MODEL:-}
      EMBED_MODEL: ${EMBED_MODEL:-ibm-granite/granite-embedding-english-r2}
      HF_TOKEN: ${HF_TOKEN:-}
      # Empty means the default from config.py.
      REQUEST_TIMEOUT_S: ${REQUEST_TIMEOUT_S:-}
      LLM_MAX_RETRIES: ${LLM_MAX_RETRIES:-1}
      LLM_RETRY_BACKOFF_S: ${LLM_RETRY_BACKOFF_S:-0.2}
      LLM_MAX_OUTPUT_TOKENS: ${LLM_MAX_OUTPUT_TOKENS:-1024}
      CONTEXT_CHAR_BUDGET: ${CONTEXT_CHAR_BUDGET:-16000}
      EVIDENCE_ITEM_CHAR_LIMIT: ${EVIDENCE_ITEM_CHAR_LIMIT:-2400}
      MAX_SENTENCE_BUFFER_CHARS: ${MAX_SENTENCE_BUFFER_CHARS:-32768}
      LOG_DIR: /app/logs
    volumes:
      # Request log (logs/requests.jsonl) on the host for evaluation.
      - ./logs:/app/logs
    extra_hosts:
      # Needed on Linux; Docker Desktop resolves host.docker.internal by itself.
      - "host.docker.internal:host-gateway"
    ports:
      - "127.0.0.1:${API_PORT:-8000}:8000"
    depends_on:
      db:
        condition: service_healthy
    healthcheck:
      test: ["CMD", "python", "-c", "import urllib.request; urllib.request.urlopen('http://localhost:8000/health')"]
      interval: 10s
      timeout: 3s
      retries: 5
    restart: unless-stopped

  ui:
    build:
      context: .
      dockerfile: docker/ui/Dockerfile
    environment:
      API_URL: http://api:8000
    ports:
      - "127.0.0.1:${UI_PORT:-8501}:8501"
    depends_on:
      api:
        condition: service_healthy
    healthcheck:
      test: ["CMD", "python", "-c", "import urllib.request; urllib.request.urlopen('http://localhost:8501/_stcore/health')"]
      interval: 10s
      timeout: 3s
      retries: 5
    restart: unless-stopped

volumes:
  pgdata: