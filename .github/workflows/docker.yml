name: Docker images

on:
  pull_request:
    paths:
      - "docker/**"
      - "compose.yaml"
      - ".dockerignore"
      - "pyproject.toml"
      - "uv.lock"
      - "src/**"
  push:
    branches: [main]
    paths:
      - "docker/**"
      - "compose.yaml"
      - ".dockerignore"
      - "pyproject.toml"
      - "uv.lock"
      - "src/**"

permissions:
  contents: read

jobs:
  build:
    runs-on: ubuntu-latest
    strategy:
      matrix:
        image: [api, ui]
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Build ${{ matrix.image }} image
        run: docker build -f docker/${{ matrix.image }}/Dockerfile -t scilitrag-${{ matrix.image }} .
