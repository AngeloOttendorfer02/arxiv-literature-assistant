name: CI

on:
  pull_request:
  push:
    branches: [main, "dev/**"]

permissions:
  contents: read

jobs:
  checks:
    runs-on: ubuntu-latest
    services:
      db:
        image: paradedb/paradedb:0.26.2-pg18
        env:
          POSTGRES_USER: postgres
          POSTGRES_PASSWORD: postgres
          POSTGRES_DB: postgres
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U postgres -d postgres"
          --health-interval 5s
          --health-timeout 3s
          --health-retries 20
    env:
      USE_MOCKS: "1"
      HF_TOKEN: ${{ secrets.HF_TOKEN }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Install uv
        uses: astral-sh/setup-uv@c771a70e6277c0a99b617c7a806ffedaca235ff9 # v9.0.0
        with:
          enable-cache: true

      - name: Cache Hugging Face models
        uses: actions/cache@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        with:
          path: ~/.cache/huggingface
          key: hf-${{ runner.os }}-${{ hashFiles('src/scilitrag/guardrails/*.py') }}
          restore-keys: hf-${{ runner.os }}-

      - name: Set up Python
        run: uv python install

      - name: Install dependencies
        run: uv sync --locked --all-groups

      - name: Lint
        run: uv run --locked --all-groups ruff check .

      - name: Format
        run: uv run --locked --all-groups ruff format --check .

      - name: Tests
        env:
          RETRIEVAL_TEST_DATABASE_URL: postgresql://postgres:postgres@localhost:5432/postgres
        run: uv run --locked --all-groups pytest -rs

      - name: Smoke test
        run: uv run --locked --all-groups python scripts/smoke.py

      - name: Smoke test with real check_input
        if: env.HF_TOKEN != ''
        # S4 and A3 fail until topic gate and write refusal (S-06, S-07) land; remove then.
        continue-on-error: true
        env:
          REAL_COMPONENTS: check_input
        run: uv run --locked --all-groups python scripts/smoke.py

      - name: Retrieval evaluation smoke
        run: uv run --locked --all-groups python scripts/evaluate_retrieval.py eval/retrieval/cases.example.json --allow-mocks --output "$RUNNER_TEMP/retrieval-evaluation.json"
