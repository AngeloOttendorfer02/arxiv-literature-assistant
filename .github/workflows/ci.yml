name: CI

on:
  pull_request:
  push:
    branches: [main, "dev/**"]

permissions:
  contents: read

jobs:
  checks:
    runs-on: ubuntu-latest
    env:
      USE_MOCKS: "1"
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Install uv
        uses: astral-sh/setup-uv@c771a70e6277c0a99b617c7a806ffedaca235ff9 # v9.0.0
        with:
          enable-cache: true

      - name: Set up Python
        run: uv python install

      - name: Install dependencies
        run: uv sync --locked --group data --group rag

      - name: Lint
        run: uv run --locked --group data --group rag ruff check .

      - name: Format
        run: uv run --locked --group data --group rag ruff format --check .

      - name: Tests
        run: uv run --locked --group data --group rag pytest

      - name: Smoke test
        run: uv run --locked --group data --group rag python scripts/smoke.py
